version = 1
default_branch = "main"
default_remote = "origin"
task_worktree_dir_template = "{{ seed_parent }}/{{ repo }}-wt-{{ slug }}-{{ shortid }}"
task_branch_template = "wt/{{ slug }}/{{ shortid }}"

[bootstrap]
enabled = true
default_profile = "local"

[bootstrap.profiles.local]
include = [ ".env", ".env.local", ".env.*.local" ]
exclude = [ "node_modules/", ".venv/", ".next/", "dist/" ]

[verify]
# Documentation-only skill repo; no build step to run. `pwsh -c ''`
# is a cross-platform no-op so `mwt deliver` can complete on both
# Unix (`true`) and Windows (where `true` is not a command).
# Add a real command here if a validator is introduced.
command = "pwsh -c ''"

[policy]
allow_ignored_seed_changes = true
allow_tracked_seed_changes = false

